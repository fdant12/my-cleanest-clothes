<div class="search">
  <input class="input-search" [(ngModel)]="inputValue" (ngModelChange)="getInputValue($event)" type="email" matInput placeholder="Filter by city">
  <button class="btn-search" matButton="filled">search</button>
</div>

<div class="cards">
    @for (item of filteredHousing; track item) {
        <app-card [data]="item"/>
    }
</div>
